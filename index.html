<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦜 Papagaio Playground</title>
    <meta name="description" content="Papagaio — live text preprocessor playground. Pattern matching with WASM.">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦜</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #111318;
            --surface: #181b22;
            --surface2: #1e2230;
            --border: #2a2f3d;
            --text: #e2e8f0;
            --text-muted: #64748b;
            --accent: #3b82f6;
            --accent-dim: rgba(59, 130, 246, .12);
            --green: #22c55e;
            --green-dim: rgba(34, 197, 94, .12);
            --red: #ef4444;
            --mono: 'JetBrains Mono', 'Fira Mono', monospace;
        }

        html,
        body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 14px;
            overflow: hidden;
        }

        /* ── Top bar ─────────────────────────────────────────── */
        #topbar {
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            user-select: none;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: -.3px;
        }

        .brand-icon {
            font-size: 18px;
            line-height: 1;
        }

        .pill {
            font-size: 11px;
            font-weight: 500;
            padding: 1px 7px;
            border-radius: 99px;
            background: var(--accent-dim);
            color: var(--accent);
            border: 1px solid rgba(59, 130, 246, .25);
        }

        .pill.live {
            background: var(--green-dim);
            color: var(--green);
            border-color: rgba(34, 197, 94, .25);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .pill.live::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .4;
            }
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            font-size: 12px;
            font-family: inherit;
            cursor: pointer;
            transition: color .15s, background .15s, border-color .15s;
            text-decoration: none;
        }

        .icon-btn:hover {
            color: var(--text);
            background: var(--surface2);
            border-color: #3a4055;
        }

        .icon-btn svg {
            flex-shrink: 0;
        }

        /* ── Workspace ───────────────────────────────────────── */
        #workspace {
            display: flex;
            height: calc(100vh - 44px - 28px);
        }

        /* ── Panels ──────────────────────────────────────────── */
        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .panel+.panel {
            border-left: 1px solid var(--border);
        }

        .panel-label {
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: var(--text-muted);
        }

        .copy-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 11px;
            font-family: inherit;
            padding: 2px 6px;
            border-radius: 4px;
            transition: color .15s, background .15s;
        }

        .copy-btn:hover {
            color: var(--text);
            background: var(--surface2);
        }

        .editor-area {
            flex: 1;
            position: relative;
            background: var(--bg);
        }

        textarea {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            padding: 16px 18px;
            background: transparent;
            color: var(--text);
            border: none;
            resize: none;
            outline: none;
            font-family: var(--mono);
            font-size: 13px;
            line-height: 1.65;
            caret-color: var(--accent);
            tab-size: 4;
        }

        textarea::placeholder {
            color: var(--text-muted);
        }

        #output {
            color: #94a3b8;
        }

        #output.error {
            color: var(--red);
        }

        /* ── Divider handle ──────────────────────────────────── */
        #divider {
            width: 4px;
            background: var(--border);
            cursor: col-resize;
            flex-shrink: 0;
            transition: background .15s;
        }

        #divider:hover,
        #divider.dragging {
            background: var(--accent);
        }

        /* ── Status bar ──────────────────────────────────────── */
        #statusbar {
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: var(--text-muted);
            gap: 16px;
        }

        #statusbar .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #status-msg {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .spinner {
            width: 9px;
            height: 9px;
            border: 1.5px solid rgba(100, 116, 139, .4);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin .7s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── Mobile tabs ─────────────────────────────────────── */
        @media (max-width: 700px) {
            #mobile-tabs {
                display: flex;
            }

            #workspace {
                flex-direction: column;
            }

            .panel {
                display: none;
            }

            .panel.active {
                display: flex;
                flex: 1;
            }

            #divider {
                display: none;
            }
        }

        #mobile-tabs {
            display: none;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .mtab {
            flex: 1;
            padding: 8px;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: color .15s, border-color .15s;
        }

        .mtab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }
    </style>
</head>

<body>

    <div id="topbar">
        <div class="brand">
            <span class="brand-icon">🦜</span>
            papagaio
            <span class="pill">v0.26.1</span>
        </div>
        <div class="topbar-right">
            <span class="pill live" id="live-badge">live</span>
            <a href="https://github.com/jardimdanificado/papagaio" target="_blank" rel="noopener" class="icon-btn">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                    <path
                        d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z" />
                </svg>
                GitHub
            </a>
        </div>
    </div>

    <div id="mobile-tabs">
        <button class="mtab active" id="mtab-in" onclick="showMobilePanel('input')">Input</button>
        <button class="mtab" id="mtab-out" onclick="showMobilePanel('output')">Output</button>
    </div>

    <div id="workspace">
        <div class="panel active" id="panel-input">
            <div class="panel-label">
                <span>input</span>
            </div>
            <div class="editor-area">
                <textarea id="input" spellcheck="false" autocorrect="off" autocapitalize="off"
                    placeholder="Write your papagaio template here…"></textarea>
            </div>
        </div>

        <div id="divider"></div>

        <div class="panel active" id="panel-output">
            <div class="panel-label">
                <span>output</span>
                <button class="copy-btn" id="copy-btn" onclick="copyOutput()">copy</button>
            </div>
            <div class="editor-area">
                <textarea id="output" readonly spellcheck="false"></textarea>
            </div>
        </div>
    </div>

    <div id="statusbar">
        <div class="left">
            <span id="status-msg">
                <span class="spinner"></span>
                loading wasm…
            </span>
            <span id="perf-msg"></span>
        </div>
        <div id="cursor-pos">Ln 1, Col 1</div>
    </div>

    <script type="module">
        import Papagaio from './dist/wasm/papagaio.js';

        const processor = new Papagaio();
        const inputEl = document.getElementById('input');
        const outputEl = document.getElementById('output');
        const statusMsg = document.getElementById('status-msg');
        const perfMsg = document.getElementById('perf-msg');
        const cursorPos = document.getElementById('cursor-pos');
        const liveBadge = document.getElementById('live-badge');

        const DEFAULT = [
            '$pattern {hello $name} {Hi, $name!}',
            'hello world',
            '',
            '$pattern {$x$int + $y$int} {= ${x} plus ${y}}',
            '3 + 7',
            '',
            '$pattern {$tag$word: $val} {[$tag] → $val}',
            'status: active',
        ].join('\n');

        /* ── init ───────────────────────────────────────────────── */
        async function init() {
            try {
                await processor.init();
                processor.setArgs(['web_ui', 'version=0.26.1', 'compiler=papagaiocc']);

                const saved = localStorage.getItem('papagaio_v3');
                inputEl.value = saved ?? DEFAULT;

                setStatus('ready');
                runProcess();
            } catch (e) {
                console.error(e);
                setStatus('error', e.message);
            }
        }

        /* ── process ────────────────────────────────────────────── */
        function runProcess() {
            if (!processor._initialized) return;
            try {
                const t0 = performance.now();
                const out = processor.process(inputEl.value);
                const ms = (performance.now() - t0).toFixed(1);
                outputEl.value = out;
                outputEl.classList.remove('error');
                perfMsg.textContent = `${ms} ms`;
                save();
            } catch (e) {
                outputEl.value = `Error: ${e.message}`;
                outputEl.classList.add('error');
                perfMsg.textContent = '';
            }
        }

        /* ── status label ───────────────────────────────────────── */
        function setStatus(kind, msg) {
            if (kind === 'ready') {
                statusMsg.innerHTML = '● engine ready';
                statusMsg.style.color = 'var(--green)';
            } else if (kind === 'error') {
                statusMsg.innerHTML = `✕ ${msg ?? 'error'}`;
                statusMsg.style.color = 'var(--red)';
                liveBadge.style.display = 'none';
            } else {
                statusMsg.innerHTML = '<span class="spinner"></span> loading wasm…';
                statusMsg.style.color = '';
            }
        }

        /* ── copy ───────────────────────────────────────────────── */
        window.copyOutput = function () {
            navigator.clipboard?.writeText(outputEl.value).catch(() => {
                outputEl.select();
                document.execCommand('copy');
            });
            const btn = document.getElementById('copy-btn');
            btn.textContent = 'copied!';
            setTimeout(() => { btn.textContent = 'copy'; }, 1500);
        };

        /* ── mobile tabs ────────────────────────────────────────── */
        window.showMobilePanel = function (which) {
            const inPanel = document.getElementById('panel-input');
            const outPanel = document.getElementById('panel-output');
            const tabIn = document.getElementById('mtab-in');
            const tabOut = document.getElementById('mtab-out');
            inPanel.classList.toggle('active', which === 'input');
            outPanel.classList.toggle('active', which === 'output');
            tabIn.classList.toggle('active', which === 'input');
            tabOut.classList.toggle('active', which === 'output');
            if (which === 'output') runProcess();
        };

        /* ── persist ────────────────────────────────────────────── */
        function save() {
            try { localStorage.setItem('papagaio_v3', inputEl.value); } catch { }
        }

        /* ── cursor info ────────────────────────────────────────── */
        function updateCursor() {
            const before = inputEl.value.slice(0, inputEl.selectionStart);
            const lines = before.split('\n');
            cursorPos.textContent = `Ln ${lines.length}, Col ${lines.at(-1).length + 1}`;
        }

        /* ── resizable divider ──────────────────────────────────── */
        (function initDivider() {
            const divider = document.getElementById('divider');
            const workspace = document.getElementById('workspace');
            const panelIn = document.getElementById('panel-input');
            const panelOut = document.getElementById('panel-output');
            let dragging = false, startX = 0, startW = 0;

            divider.addEventListener('mousedown', e => {
                dragging = true;
                startX = e.clientX;
                startW = panelIn.getBoundingClientRect().width;
                divider.classList.add('dragging');
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
            });

            document.addEventListener('mousemove', e => {
                if (!dragging) return;
                const total = workspace.getBoundingClientRect().width;
                const newW = Math.max(200, Math.min(total - 200, startW + (e.clientX - startX)));
                panelIn.style.flex = 'none';
                panelIn.style.width = newW + 'px';
            });

            document.addEventListener('mouseup', () => {
                if (!dragging) return;
                dragging = false;
                divider.classList.remove('dragging');
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
            });
        })();

        /* ── events ─────────────────────────────────────────────── */
        inputEl.addEventListener('input', runProcess);

        inputEl.addEventListener('keydown', e => {
            if (e.key === 'Tab') {
                e.preventDefault();
                const s = inputEl.selectionStart;
                const v = inputEl.value;
                inputEl.value = v.slice(0, s) + '    ' + v.slice(inputEl.selectionEnd);
                inputEl.selectionStart = inputEl.selectionEnd = s + 4;
                runProcess();
            }
        });

        inputEl.addEventListener('keyup', updateCursor);
        inputEl.addEventListener('click', updateCursor);
        inputEl.addEventListener('selectionchange', updateCursor);

        init();
    </script>
</body>

</html>
